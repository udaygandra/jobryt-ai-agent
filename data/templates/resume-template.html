<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume</title>
    <style>
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; line-height: 1.6; color: #333; margin: 0; padding: 40px; }
        h1 { font-size: 24px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; color: #2c3e50; }
        .contact-info { font-size: 14px; color: #7f8c8d; margin-bottom: 30px; }
        h2 { font-size: 18px; color: #2980b9; border-bottom: 2px solid #ecf0f1; padding-bottom: 5px; margin-top: 30px; }
        .job-title { font-weight: bold; font-size: 16px; margin-bottom: 2px; }
        .company { font-style: italic; color: #7f8c8d; margin-bottom: 10px; }
        ul { margin-top: 5px; padding-left: 20px; }
        li { margin-bottom: 8px; font-size: 14px; }
        .skills-list { font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>{{NAME}}</h1>
    <div class="contact-info">
        {{LOCATION}} | {{TARGET_TITLES}}
    </div>

    <h2>Tailored Summary / Cover Letter</h2>
    <p style="font-size: 14px;">{{COVER_LETTER}}</p>

    <h2>Experience</h2>
    <div class="job">
        <div class="job-title">{{RELEVANT_ROLE}}</div>
        <div class="company">{{RELEVANT_COMPANY}} | {{RELEVANT_DATES}}</div>
        <ul>
            {{BULLETS_HTML}}
        </ul>
    </div>

    <h2>Skills</h2>
    <div class="skills-list">
        {{SKILLS}}
    </div>

</body>
</html>
